name: Build NEBULA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS Geode mod
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            prevter/geode-sdk:ios-latest \
             bash -lc 'rm -rf build && cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build'

      - name: Find the .geode file
        run: |
          find . -type f -name '*.geode'
          test -n "$(find . -type f -name '*.geode' -print -quit)"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-geode
          path: '**/*.geode'
          if-no-files-found: error
