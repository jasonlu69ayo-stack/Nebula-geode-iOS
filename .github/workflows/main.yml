docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            prevter/geode-sdk:ios-latest 
             
bash -lc 'rm -rf build && CXXFLAGS="-include Geode/fmod/fmod.hpp" cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build'
      - name: Find the .geode file
        run: |
          find . -type f -name '*.geode'
          test -n "$(find . -type f -name '*.geode' -print -quit)"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-geode
          path: '**/*.geode'
          if-no-files-found: error
